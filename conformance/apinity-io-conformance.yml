      Provider-facing docs state uploaded API definitions may be OpenAPI 2.0, 3.0 or 3.1 (JSON only, YAML
      not supported) and that only the first servers[] entry is honoured
      (https://docs.apinity.io/step-by-step/provide-a-service-on-the-marketplace/add-an-api).
      This is the platform consuming the standard, not publishing a contract in it.
