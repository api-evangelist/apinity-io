conformance:
  - id: oauth2
    conforms: true
    evidence: >-
      Consumer Client OAuth2 login uses grant_type=client_credentials and grant_type=refresh_token as
      application/x-www-form-urlencoded POSTs and returns access_token / refresh_token / expires_in /
      refresh_token_expires_in (https://docs.apinity.io/step-by-step/subscribe-and-consume-a-service/consume-an-api-technical-implementation).
      Non-standard details: the token endpoint is the per-subscription {EndpointURI}/login on the gateway
      rather than the issuer's token endpoint, and the token is sent in x-apx-authorization, not Authorization.
  - id: oidc
    conforms: true
    evidence: >-
      The realm issuing the gateway's JWTs serves a full OpenID Connect discovery document
      (issuer https://auth.apinity.io/realms/syncier-marketplace-engine; saved verbatim to
      well-known/apinity-io-openid-configuration.json) listing authorization_code, client_credentials,
      device_code, token-exchange and CIBA grants, PKCE S256, private_key_jwt and tls_client_auth.
      The document describes the Keycloak realm; only client_credentials is documented for API consumers.
  - id: openapi-ingest
    conforms: true
