  - Integration Platform
description: >-
  apinity publishes no plans or prices for its own platform. The whitelabel SaaS is sold by demo and
  sales contact (sales@apinity.io); the pricing page the documentation points at (apinity.io) now redirects
  to BIPRO Service GmbH. The plan model the docs DO describe is the one each third-party service provider
  configures for its services on an apinity tenant. The three-tier scaffold this file carried until
  2026-09-18 (Free 1,000 req/month, Professional, Enterprise) was an API Evangelist sweep default with no
  provider source and has been removed.
plan_count: 0
plans: []
plan_model_for_hosted_services:
  note: how plans on an apinity marketplace are shaped, per the provider docs — attributes of the platform, not prices of apinity
  service_types: [API, Application]
  demo_plans: free plans highlighted in the catalog; a rate limit is mandatory on a demo plan
  visibility: [Selected Workspaces, All Workspaces]
  pricing_dimensions:
    API: [price per period, price per unit (request) with optional tiered threshold, price per transaction with optional threshold]
    Application: [price per period, price per user with threshold, price per setup]
  limits: amount of requests per period, defined per plan
  transactions: Single Request (endpoint + HTTP response codes) or Response Header (endpoint set + header name/value)
  currencies: multiple, chosen by the tenant administrator (since 2023-10)
  subscription_approval: optional per plan; providers may require additional questions before approval (since 2024-04)
