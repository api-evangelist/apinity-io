evidence:
  - url: https://apinity.io/
    status: 301
    note: the page the docs send readers to "for more information about features and pricing" now redirects to https://bipro-service.gmbh/, which carries no apinity pricing
  - url: https://apinity.io/product/
    status: 301
  - url: https://docs.apinity.io/step-by-step/provide-a-service-on-the-marketplace/add-a-plan
    status: 200
    note: describes how a SERVICE PROVIDER prices its own plans on a tenant (per period, per request with threshold, per transaction); not apinity's own platform pricing
tags:
  - API Governance
  - API Marketplace
  - Compliance
