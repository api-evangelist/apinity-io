description: >-
  apinity publishes no rate limits of its own. Limits on an apinity marketplace are per-plan quotas
  ("100 Requests per month") that each service provider configures under Limits and Pricing, with a
  limit mandatory on Demo plans; the amounts are whatever each provider sets and are visible only to
  subscribers. No rate-limit response headers, exhaustion status code or backoff guidance are documented
  for the gateway. The scaffold values this file carried until 2026-09-18 (10/100/1,000 req/min per
  tier, X-RateLimit-* headers) were API Evangelist sweep defaults with no provider source and have been removed.
limit_count: 0
limits: []
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  note: none documented; the only documented response headers are X-Kong-Upstream-Latency and X-Kong-Proxy-Latency (milliseconds), for performance testing
responseCodes:
  throttled: null
  note: the exhaustion status code is not documented
plan_limit_model:
  scope: per subscription plan, configured by the service provider
  unit: Requests
  period: provider-chosen interval
  demo_plans: rate limit mandatory
